[package]
name = "titan_text"
version = "0.1.0"
edition = "2021"
description = "A lean morphogenic neural-cellular sequence laboratory for Termux and ARM64"

[dependencies]
candle-core = "0.4.1"
candle-nn = "0.4.1"
ndarray = "0.15.6"
anyhow = "1.0.81"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.12"

# Pinned for candle compatibility
rand = "=0.8.5"
rand_distr = "=0.4.3"
half = "=2.3.1"

[[bin]]
name = "titan_text"
path = "src/main.rs"

[[bin]]
name = "titan_substrate"
path = "src/substrate_main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
